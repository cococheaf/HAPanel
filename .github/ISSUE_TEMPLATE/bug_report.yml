name: Fehler melden
description: Einen reproduzierbaren Fehler in HAPanel beschreiben
body:
  - type: textarea
    id: behavior
    attributes:
      label: Was passiert?
      description: Erwartetes Verhalten, tatsächliches Verhalten und Schritte zum Nachstellen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      placeholder: HAPanel-Version, HA-Version, Browser, Displayprofil
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Zusätzliche Informationen
      description: Keine Tokens, Kopplungscodes oder privaten HA-Konfigurationen veröffentlichen.
