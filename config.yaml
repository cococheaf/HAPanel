name: HAPanel
version: '2.0.1'
slug: hapanel
description: Independent iOS-inspired wall dashboards with a visual editor
url: https://github.com/cococheaf/HAPanel
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_entry: display.html
panel_icon: mdi:view-dashboard-variant
panel_title: HAPanel
panel_admin: false
homeassistant_api: true
hassio_api: false
ports:
  8098/tcp: null
ports_description:
  8098/tcp: Optional paired display endpoint (use HTTPS through a reverse proxy)
options:
  demo_mode: true
  display_enabled: false
  public_origin: ''
  camera_access: admin
  alarm_access: admin
schema:
  demo_mode: bool
  display_enabled: bool
  public_origin: str
  camera_access: list(admin|authenticated)
  alarm_access: list(admin|authenticated)
